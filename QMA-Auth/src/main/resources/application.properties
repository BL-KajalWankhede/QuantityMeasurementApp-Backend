server.port=5000
spring.application.name=qma-auth
server.forward-headers-strategy=framework

spring.datasource.url=${QMA_AUTH_DB_URL:${QMA_DB_URL:jdbc:h2:file:./data/qma-auth;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${QMA_AUTH_DB_USERNAME:${QMA_DB_USERNAME:sa}}
spring.datasource.password=${QMA_AUTH_DB_PASSWORD:${QMA_DB_PASSWORD:}}
spring.datasource.driver-class-name=${QMA_AUTH_DB_DRIVER:${QMA_DB_DRIVER:org.h2.Driver}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${QMA_JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-bytes}
app.jwt.expiration-ms=${QMA_JWT_EXPIRATION_MS:3600000}
app.auth.cookie.secure=${QMA_COOKIE_SECURE:false}

app.oauth2.redirect-uri=${QMA_OAUTH2_REDIRECT_URI:https://quantitymeasurementapp-p0gz.onrender.com/oauth/callback}
app.oauth2.frontend-origin=${QMA_FRONTEND_ORIGIN:https://quantitymeasurementapp-p0gz.onrender.com}
app.cors.allowed-origins=${QMA_CORS_ALLOWED_ORIGINS:https://quantitymeasurementapp-p0gz.onrender.com,http://localhost:5173,http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.auth-redirect-uri=${QMA_GOOGLE_AUTH_REDIRECT_URI:http://localhost:4000/login/oauth2/code/google}

logging.level.org.springframework.security=INFO
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
