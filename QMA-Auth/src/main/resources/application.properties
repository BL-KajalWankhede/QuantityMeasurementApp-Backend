server.port=5000
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
spring.application.name=QMA-AUTH

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:2}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=15000
spring.datasource.hikari.max-lifetime=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${QMA_JWT_SECRET}
app.jwt.expiration-ms=${QMA_JWT_EXPIRATION_MS}
app.auth.cookie.secure=true
app.auth.cookie.domain=onrender.com

app.oauth2.redirect-uri=${QMA_OAUTH2_REDIRECT_URI}
app.oauth2.frontend-origin=${QMA_FRONTEND_ORIGIN}
app.cors.allowed-origins=${QMA_CORS_ALLOWED_ORIGINS}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${QMA_GOOGLE_AUTH_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.com.netflix.discovery=DEBUG
logging.level.com.netflix.eureka=DEBUG

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=15
eureka.instance.lease-expiration-duration-in-seconds=60

eureka.instance.hostname=quantitymeasurementapp-auth-9cyo.onrender.com
eureka.instance.non-secure-port-enabled=true
eureka.instance.non-secure-port=5000
eureka.instance.status-page-url=https://quantitymeasurementapp-auth-9cyo.onrender.com/actuator/health

spring.cloud.service-registry.auto-registration.enabled=true