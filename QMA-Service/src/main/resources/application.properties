# Production Database (Aiven/Render) - With Local Fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantity_measurement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pooling (Extreme limits for Aiven Free Tier)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:2}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=15000
spring.datasource.hikari.max-lifetime=60000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false






